<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Moedas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .loader {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left-color: #4f46e5;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen antialiased">
    <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-lg w-full max-w-md space-y-6">
        <h1 class="text-2xl font-bold text-center text-gray-900">Conversor de Moedas</h1>
        <div class="space-y-4">
            <div>
                <label for="amount" class="block text-sm font-medium text-gray-700 mb-1">Valor</label>
                <div class="relative">
                    <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
                        <span class="text-gray-500 sm:text-sm">$</span>
                    </div>
                    <input type="number" id="amount" name="amount" placeholder="100.00" class="block w-full rounded-md border-gray-300 pl-7 pr-3 py-2 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
                </div>
            </div>

            <div class="flex items-end space-x-4">
                <div class="flex-1">
                    <label for="from-currency" class="block text-sm font-medium text-gray-700 mb-1">De</label>
                    <select id="from-currency" name="from-currency" class="block w-full rounded-md border-gray-300 py-2 pl-3 pr-10 text-base shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-indigo-500 sm:text-sm">
                        <!-- Opções preenchidas via JS -->
                    </select>
                </div>

                <button id="swap-button" title="Inverter moedas" class="flex items-center justify-center h-9 w-9 rounded-md bg-gray-100 text-gray-600 hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition-transform duration-300 ease-in-out">
                    <i class="ph ph-arrows-left-right text-lg"></i>
                </button>

                <div class="flex-1">
                    <label for="to-currency" class="block text-sm font-medium text-gray-700 mb-1">Para</label>
                    <select id="to-currency" name="to-currency" class="block w-full rounded-md border-gray-300 py-2 pl-3 pr-10 text-base shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-indigo-500 sm:text-sm">
                        <!-- Opções preenchidas via JS -->
                    </select>
                </div>
            </div>
        </div>

        <div>
            <button id="convert-button" class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all duration-300">
                Converter
            </button>
        </div>

        <div id="result-area" class="text-center text-lg font-semibold text-gray-800 pt-4 min-h-[50px] flex items-center justify-center">
            <!-- O resultado da conversão aparecerá aqui -->
        </div>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:5000/convert';

        const amountInput = document.getElementById('amount');
        const fromCurrencySelect = document.getElementById('from-currency');
        const toCurrencySelect = document.getElementById('to-currency');
        const convertButton = document.getElementById('convert-button');
        const swapButton = document.getElementById('swap-button');
        const resultArea = document.getElementById('result-area');

        const currencies = ['BRL', 'USD', 'EUR', 'JPY', 'GBP', 'CAD', 'AUD', 'CHF', 'CNY'];

        function populateCurrencies() {
            fromCurrencySelect.innerHTML = '';
            toCurrencySelect.innerHTML = '';
            currencies.forEach(currency => {
                const option1 = new Option(currency, currency);
                const option2 = new Option(currency, currency);
                fromCurrencySelect.add(option1);
                toCurrencySelect.add(option2);
            });
            fromCurrencySelect.value = 'BRL';
            toCurrencySelect.value = 'USD';
        }
        
        function swapCurrencies() {
            const fromValue = fromCurrencySelect.value;
            fromCurrencySelect.value = toCurrencySelect.value;
            toCurrencySelect.value = fromValue;
            
            swapButton.classList.toggle('rotate-180');
        }

        function formatCurrency(value, currency) {
            try {
                return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: currency, minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(value);
            } catch (e) {
                 return `${value.toFixed(2)} ${currency}`;
            }
        }

        async function handleConversion() {
            const amount = amountInput.value;
            const fromCurr = fromCurrencySelect.value;
            const toCurr = toCurrencySelect.value;

            if (!amount || amount <= 0) {
                resultArea.innerHTML = `<span class="text-sm font-medium text-red-600">Por favor, insira um valor válido.</span>`;
                return;
            }

            resultArea.innerHTML = '<div class="loader"></div>';
            convertButton.disabled = true;
            convertButton.classList.add('opacity-50', 'cursor-not-allowed');

            try {
                const url = `${API_URL}?amount=${amount}&from_curr=${fromCurr}&to_curr=${toCurr}`;
                const response = await fetch(url);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Erro desconhecido na API');
                }
                
                const originalFormatted = formatCurrency(data.original_amount, data.from_currency);
                const convertedFormatted = formatCurrency(data.converted_amount, data.to_currency);

                resultArea.innerHTML = `<div class="text-center">
                    <p class="text-gray-600 text-sm">${originalFormatted} é igual a</p>
                    <p class="text-2xl font-bold text-indigo-600">${convertedFormatted}</p>
                </div>`;

            } catch (error) {
                resultArea.innerHTML = `<span class="text-sm font-medium text-red-600">Erro: ${error.message}</span>`;
            } finally {
                convertButton.disabled = false;
                convertButton.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        convertButton.addEventListener('click', handleConversion);
        swapButton.addEventListener('click', swapCurrencies);
        amountInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                handleConversion();
            }
        });

        populateCurrencies();
    </script>

</body>
</html>
